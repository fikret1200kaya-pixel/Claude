plugins {
    id 'com.android.application'
}

android {
    namespace 'com.fatih.oyun'
    compileSdk 34

    defaultConfig {
        applicationId 'com.fatih.oyun'
        minSdk 24
        targetSdk 34
        versionCode Integer.parseInt(System.getenv('VERSION_CODE') ?: '1')
        versionName "1.0." + (System.getenv('VERSION_CODE') ?: '1')
    }

    buildTypes {
        release {
            minifyEnabled false
            // Ayrı bir imza anahtarı tanımlanmadığı için hata ayıklama anahtarıyla imzalanır (kurulabilir APK).
            signingConfig signingConfigs.debug
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }

    // Oyun görselleri zaten sıkıştırılmış PNG; yeniden sıkıştırmaya gerek yok
    androidResources {
        noCompress += ['png', 'js', 'html']
    }
}

dependencies {
    implementation 'androidx.webkit:webkit:1.11.0'
}
