name: APK sürümlerini kaldır

on:
  push:
    paths: ['.github/workflows/remove-apk-releases.yml']

permissions:
  contents: write

jobs:
  remove:
    runs-on: ubuntu-latest
    steps:
      - name: apk-* sürümlerini ve etiketlerini sil
        env:
          GH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
          REPO: ${{ github.repository }}
        run: |
          for tag in $(gh release list --repo "$REPO" --limit 100 --json tagName --jq '.[].tagName' | grep '^apk-' || true); do
            echo "siliniyor: $tag"
            gh release delete "$tag" --repo "$REPO" --cleanup-tag --yes
          done
          echo "kalan sürümler:"; gh release list --repo "$REPO" --limit 100 || true
